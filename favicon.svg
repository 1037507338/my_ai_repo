<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6cf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a5ce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="45" fill="url(#bg)"/>
  
  <!-- 上升趋势图标 -->
  <polyline points="25,65 40,45 55,55 70,30 80,35" 
            fill="none" 
            stroke="white" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
  
  <!-- 上升趋势箭头 -->
  <polygon points="75,30 85,30 80,20" fill="white"/>
</svg>
