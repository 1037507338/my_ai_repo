<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基金实时估值跟踪器 v5.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 12px;
        }

        .controls {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 250px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px; /* 防止iOS缩放 */
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-add {
            background: #28a745;
            color: white;
        }

        .btn-add:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40,167,69,0.4);
        }

        .btn-refresh {
            background: #007bff;
            color: white;
        }

        .btn-refresh:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
        }

        .btn-clear {
            background: #dc3545;
            color: white;
        }

        .btn-clear:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220,53,69,0.4);
        }

        .status-bar {
            padding: 12px 15px;
            background: #e9ecef;
            font-size: 12px;
            color: #495057;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-bar .time {
            font-weight: 600;
            color: #667eea;
        }

        /* 桌面端：表格布局 */
        .table-container {
            overflow-x: auto;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #495057;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background 0.2s;
            cursor: move;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr.dragging {
            opacity: 0.5;
            background: #fff3cd;
        }

        tbody tr.drag-over {
            border-top: 3px solid #667eea;
        }

        tbody tr.updating {
            animation: flash 0.5s;
        }

        @keyframes flash {
            0%, 100% { background: white; }
            50% { background: #fff3cd; }
        }

        td {
            padding: 12px;
            font-size: 13px;
        }

        .drag-handle {
            color: #adb5bd;
            cursor: move;
            user-select: none;
        }

        .drag-handle:hover {
            color: #495057;
        }

        .fund-code {
            font-weight: 600;
            color: #667eea;
        }

        .fund-name {
            color: #495057;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav {
            font-family: "Courier New", monospace;
            font-weight: 600;
        }

        .growth {
            font-weight: 700;
            font-size: 14px;
            font-family: "Courier New", monospace;
        }

        .growth.positive {
            color: #dc3545;
        }

        .growth.negative {
            color: #28a745;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc3545;
            font-size: 12px;
        }

        /* 移动端：卡片布局 */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .controls {
                flex-direction: column;
                padding: 10px;
            }

            .input-group {
                min-width: 100%;
            }

            .input-group input {
                font-size: 16px; /* 防止iOS自动缩放 */
            }

            button {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }

            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            /* 隐藏表格，显示卡片 */
            .table-container {
                display: none;
            }

            .cards-container {
                display: block;
                padding: 10px;
            }

            .fund-card {
                background: white;
                border: 1px solid #e9ecef;
                border-radius: 12px;
                padding: 15px;
                margin-bottom: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                position: relative;
            }

            .fund-card.dragging {
                opacity: 0.5;
                background: #fff3cd;
            }

            .fund-card.drag-over {
                border-top: 3px solid #667eea;
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
            }

            .card-fund-code {
                font-weight: 700;
                font-size: 16px;
                color: #667eea;
            }

            .card-drag-handle {
                color: #adb5bd;
                cursor: move;
                font-size: 18px;
            }

            .card-fund-name {
                font-size: 14px;
                color: #495057;
                margin-bottom: 10px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .card-data {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-bottom: 10px;
            }

            .card-data-item {
                background: #f8f9fa;
                padding: 8px;
                border-radius: 6px;
                text-align: center;
            }

            .card-data-label {
                font-size: 11px;
                color: #6c757d;
                margin-bottom: 4px;
            }

            .card-data-value {
                font-size: 14px;
                font-weight: 600;
                font-family: "Courier New", monospace;
            }

            .card-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 11px;
                color: #6c757d;
            }

            .card-delete-btn {
                padding: 8px 16px;
                background: #dc3545;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                width: 100%;
                margin-top: 10px;
            }
        }

        /* 桌面端：隐藏卡片 */
        @media (min-width: 769px) {
            .cards-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 基金实时估值跟踪器 v5.0</h1>
            <p>✨ 支持拖拽排序 · 移动端适配 · 服务器存储</p>
        </div>

        <div class="controls">
            <div class="input-group">
                <input 
                    type="text" 
                    id="fundCodeInput" 
                    placeholder="输入基金代码（如：003567）"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    onkeypress="if(event.key==='Enter') addFund()"
                >
                <button class="btn-add" onclick="addFund()">➕ 添加</button>
            </div>
            <button class="btn-refresh" onclick="refreshAll()">🔄 刷新</button>
            <button class="btn-clear" onclick="clearAll()">🗑️ 清空</button>
        </div>

        <div class="status-bar">
            <div>
                <span>📅 交易日：</span>
                <span class="time" id="tradingDate">--</span>
                <span style="margin-left: 10px;">⏰ 当前：</span>
                <span class="time" id="currentTime">--:--:--</span>
            </div>
            <div>
                最后更新：<span id="lastUpdateTime" class="time">--</span>
                <span style="margin-left: 10px; color: #6c757d;">|</span>
                <span style="margin-left: 10px; font-size: 11px; color: #6c757d;">自动刷新：2分钟</span>
            </div>
        </div>

        <!-- 桌面端：表格布局 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">⇅</th>
                        <th>序号</th>
                        <th>基金代码</th>
                        <th>基金名称</th>
                        <th>昨日净值</th>
                        <th>估算净值</th>
                        <th>估算涨幅</th>
                        <th>估值时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="fundTableBody">
                    <tr class="empty-state-row">
                        <td colspan="9">
                            <div class="empty-state">
                                <p><strong>暂无基金</strong></p>
                                <p>在上方输入框中添加基金代码开始跟踪</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 移动端：卡片布局 -->
        <div class="cards-container" id="fundCardsContainer">
            <div class="empty-state">
                <p><strong>暂无基金</strong></p>
                <p>在上方输入框中添加基金代码开始跟踪</p>
            </div>
        </div>

        <div class="loading" id="loadingIndicator" style="display: none;">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">正在获取数据...</p>
        </div>
    </div>

    <script>
        // 基金列表
        let fundList = [];
        let refreshInterval = null;
        let isLoading = false;
        let dragSrcEl = null;
        let useServerStorage = true; // 是否使用服务器存储

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始初始化...');
            loadFundList();
            updateTime();
            setInterval(updateTime, 1000);
            
            if (fundList.length > 0) {
                console.log('检测到已有基金列表，开始加载数据...');
                refreshAll();
                startAutoRefresh();
            }
        });

        // 加载基金列表（优先从服务器，备用localStorage）
        async function loadFundList() {
            if (useServerStorage) {
                try {
                    const data = await fetchFundListFromServer();
                    if (data && data.length > 0) {
                        fundList = data;
                        console.log('从服务器加载基金列表：', fundList);
                        renderTable();
                        renderCards();
                        return;
                    }
                } catch (error) {
                    console.warn('从服务器加载失败，使用localStorage：', error);
                    useServerStorage = false;
                }
            }
            
            // 备用：从localStorage加载
            const saved = localStorage.getItem('fundTrackerList');
            if (saved) {
                fundList = JSON.parse(saved);
                console.log('从localStorage加载基金列表：', fundList);
                renderTable();
                renderCards();
            }
        }

        // 保存基金列表（同时保存到服务器和localStorage）
        async function saveFundList() {
            // 总是保存到localStorage（作为备用）
            localStorage.setItem('fundTrackerList', JSON.stringify(fundList));
            
            // 尝试保存到服务器
            if (useServerStorage) {
                try {
                    await saveFundListToServer(fundList);
                    console.log('基金列表已保存到服务器');
                } catch (error) {
                    console.warn('保存到服务器失败：', error);
                    useServerStorage = false;
                }
            }
        }

        // 从服务器加载基金列表
        async function fetchFundListFromServer() {
            const response = await fetch('/api/funds');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const result = await response.json();
            if (result.code !== 0) {
                throw new Error(result.error || 'API返回错误');
            }
            return result.data;
        }

        // 保存基金列表到服务器
        async function saveFundListToServer(funds) {
            const response = await fetch('/api/funds', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(funds)
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const result = await response.json();
            if (result.code !== 0) {
                throw new Error(result.error || 'API返回错误');
            }
        }

        // 添加基金
        async function addFund() {
            if (isLoading) {
                alert('正在加载中，请稍候...');
                return;
            }

            const input = document.getElementById('fundCodeInput');
            const code = input.value.trim();
            
            if (!code) {
                alert('请输入基金代码！');
                return;
            }

            if (fundList.includes(code)) {
                alert('该基金已在列表中！');
                return;
            }

            console.log('开始添加基金：', code);
            showLoading(true);
            isLoading = true;
            
            try {
                const data = await fetchFundData(code);
                if (data) {
                    console.log('基金数据获取成功：', data);
                    fundList.push(code);
                    await saveFundList();
                    renderTable();
                    renderCards();
                    input.value = '';
                    refreshAll();
                    startAutoRefresh();
                } else {
                    alert('基金代码无效或无法获取数据！');
                }
            } catch (error) {
                console.error('添加基金失败：', error);
                alert('获取基金数据失败：' + error.message);
            } finally {
                showLoading(false);
                isLoading = false;
            }
        }

        // 删除基金
        async function deleteFund(index) {
            if (confirm('确定要删除这只基金吗？')) {
                fundList.splice(index, 1);
                await saveFundList();
                renderTable();
                renderCards();
                
                if (fundList.length === 0) {
                    stopAutoRefresh();
                }
            }
        }

        // 清空列表
        async function clearAll() {
            if (fundList.length === 0) {
                alert('列表已为空！');
                return;
            }

            if (confirm('确定要清空所有基金吗？此操作不可恢复！')) {
                fundList = [];
                await saveFundList();
                renderTable();
                renderCards();
                stopAutoRefresh();
            }
        }

        // 获取基金数据（使用Vercel API代理）
        async function fetchFundData(fundCode) {
            try {
                console.log('开始获取基金数据：', fundCode);
                
                const response = await fetch(`/api/fund?code=${fundCode}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.code !== 0) {
                    throw new Error(result.error || 'API返回错误');
                }
                
                const data = result.data;
                
                console.log('API返回数据：', data);
                
                const output = {
                    code: data.fundcode,
                    name: data.name,
                    nav: parseFloat(data.dwjz),
                    estimatedNav: data.gsz ? parseFloat(data.gsz) : null,
                    growth: data.gszzl ? parseFloat(data.gszzl) : 0,
                    time: data.gztime
                };
                
                return output;
                
            } catch (error) {
                console.error('获取基金数据失败：', error);
                throw error;
            }
        }

        // 刷新所有基金
        async function refreshAll() {
            if (fundList.length === 0) return;
            if (isLoading) return;
            
            console.log('开始刷新所有基金...');
            showLoading(true);
            isLoading = true;
            
            for (let i = 0; i < fundList.length; i++) {
                const code = fundList[i];
                console.log(`刷新基金 ${i+1}/${fundList.length}：`, code);
                
                try {
                    const data = await fetchFundData(code);
                    if (data) {
                        updateRow(i, data);
                        updateCard(i, data);
                    }
                } catch (error) {
                    console.error('刷新基金失败：', code, error);
                    updateRowError(i);
                    updateCardError(i);
                }
            }
            
            document.getElementById('lastUpdateTime').textContent = new Date().toLocaleTimeString('zh-CN');
            showLoading(false);
            isLoading = false;
        }

        // 更新表格行
        function updateRow(index, data) {
            const tbody = document.getElementById('fundTableBody');
            const rows = tbody.querySelectorAll('tr:not(.empty-state-row)');
            
            if (index >= rows.length) return;
            
            const row = rows[index];
            row.classList.add('updating');
            
            row.cells[3].textContent = data.name;
            row.cells[4].textContent = data.nav.toFixed(4);
            
            if (data.estimatedNav !== null && data.estimatedNav !== undefined) {
                row.cells[5].textContent = data.estimatedNav.toFixed(4);
                
                const growthCell = row.cells[6];
                growthCell.textContent = data.growth.toFixed(2) + '%';
                growthCell.className = 'growth ' + (data.growth >= 0 ? 'positive' : 'negative');
                
                row.cells[7].textContent = data.time;
            } else {
                row.cells[5].textContent = '暂无';
                row.cells[6].textContent = '--';
                row.cells[6].className = 'growth';
                row.cells[7].textContent = '非交易时间';
            }
            
            setTimeout(() => row.classList.remove('updating'), 500);
        }

        // 更新卡片
        function updateCard(index, data) {
            const container = document.getElementById('fundCardsContainer');
            const cards = container.querySelectorAll('.fund-card');
            
            if (index >= cards.length) return;
            
            const card = cards[index];
            card.classList.add('updating');
            
            card.querySelector('.card-fund-name').textContent = data.name;
            card.querySelector('.card-data-item:nth-child(1) .card-data-value').textContent = data.nav.toFixed(4);
            
            if (data.estimatedNav !== null && data.estimatedNav !== undefined) {
                card.querySelector('.card-data-item:nth-child(2) .card-data-value').textContent = data.estimatedNav.toFixed(4);
                
                const growthValue = card.querySelector('.card-data-item:nth-child(3) .card-data-value');
                growthValue.textContent = data.growth.toFixed(2) + '%';
                growthValue.style.color = data.growth >= 0 ? '#dc3545' : '#28a745';
                
                card.querySelector('.card-footer').innerHTML = `<span>${data.time}</span><span>估值时间</span>`;
            } else {
                card.querySelector('.card-data-item:nth-child(2) .card-data-value').textContent = '暂无';
                card.querySelector('.card-data-item:nth-child(3) .card-data-value').textContent = '--';
                card.querySelector('.card-footer').innerHTML = `<span>非交易时间</span><span>--</span>`;
            }
            
            setTimeout(() => card.classList.remove('updating'), 500);
        }

        // 更新行（错误）
        function updateRowError(index) {
            const tbody = document.getElementById('fundTableBody');
            const rows = tbody.querySelectorAll('tr:not(.empty-state-row)');
            
            if (index >= rows.length) return;
            
            const row = rows[index];
            row.cells[3].textContent = '获取失败';
            row.cells[3].className = 'error';
            row.cells[4].textContent = '--';
            row.cells[5].textContent = '--';
            row.cells[6].textContent = '--';
            row.cells[7].textContent = '--';
        }

        // 更新卡片（错误）
        function updateCardError(index) {
            const container = document.getElementById('fundCardsContainer');
            const cards = container.querySelectorAll('.fund-card');
            
            if (index >= cards.length) return;
            
            const card = cards[index];
            card.querySelector('.card-fund-name').textContent = '获取失败';
            card.querySelector('.card-fund-name').className = 'card-fund-name error';
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('fundTableBody');
            
            if (fundList.length === 0) {
                tbody.innerHTML = `
                    <tr class="empty-state-row">
                        <td colspan="9">
                            <div class="empty-state">
                                <p><strong>暂无基金</strong></p>
                                <p>在上方输入框中添加基金代码开始跟踪</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = '';
            
            fundList.forEach((code, index) => {
                const row = document.createElement('tr');
                row.draggable = true;
                row.dataset.index = index;
                
                row.innerHTML = `
                    <td class="drag-handle">☰</td>
                    <td>${index + 1}</td>
                    <td class="fund-code">${code}</td>
                    <td class="fund-name">加载中...</td>
                    <td class="nav">--</td>
                    <td class="nav">--</td>
                    <td class="growth">--</td>
                    <td>--</td>
                    <td><button class="delete-btn" onclick="deleteFund(${index})">删除</button></td>
                `;
                
                row.addEventListener('dragstart', handleDragStart);
                row.addEventListener('dragover', handleDragOver);
                row.addEventListener('dragenter', handleDragEnter);
                row.addEventListener('dragleave', handleDragLeave);
                row.addEventListener('drop', handleDrop);
                row.addEventListener('dragend', handleDragEnd);
                
                tbody.appendChild(row);
            });
        }

        // 渲染卡片（移动端）
        function renderCards() {
            const container = document.getElementById('fundCardsContainer');
            
            if (fundList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p><strong>暂无基金</strong></p>
                        <p>在上方输入框中添加基金代码开始跟踪</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            fundList.forEach((code, index) => {
                const card = document.createElement('div');
                card.className = 'fund-card';
                card.draggable = true;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-fund-code">${code}</span>
                        <span class="card-drag-handle">☰</span>
                    </div>
                    <div class="card-fund-name">加载中...</div>
                    <div class="card-data">
                        <div class="card-data-item">
                            <div class="card-data-label">昨日净值</div>
                            <div class="card-data-value">--</div>
                        </div>
                        <div class="card-data-item">
                            <div class="card-data-label">估算净值</div>
                            <div class="card-data-value">--</div>
                        </div>
                        <div class="card-data-item">
                            <div class="card-data-label">估算涨幅</div>
                            <div class="card-data-value">--</div>
                        </div>
                        <div class="card-data-item">
                            <div class="card-data-label">状态</div>
                            <div class="card-data-value">--</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>--</span>
                        <span>估值时间</span>
                    </div>
                    <button class="card-delete-btn" onclick="deleteFund(${index})">删除</button>
                `;
                
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
                
                container.appendChild(card);
            });
        }

        // 拖拽功能
        function handleDragStart(e) {
            dragSrcEl = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            
            if (dragSrcEl !== this) {
                const srcIndex = parseInt(dragSrcEl.dataset.index);
                const destIndex = parseInt(this.dataset.index);
                
                console.log(`拖拽排序：${srcIndex} → ${destIndex}`);
                
                const draggedItem = fundList[srcIndex];
                fundList.splice(srcIndex, 1);
                fundList.splice(destIndex, 0, draggedItem);
                
                saveFundList();
                renderTable();
                renderCards();
            }
            
            return false;
        }

        function handleDragEnd(e) {
            const rows = document.querySelectorAll('#fundTableBody tr:not(.empty-state-row)');
            rows.forEach(row => {
                row.classList.remove('dragging');
                row.classList.remove('drag-over');
            });
            
            const cards = document.querySelectorAll('.fund-card');
            cards.forEach(card => {
                card.classList.remove('dragging');
                card.classList.remove('drag-over');
            });
        }

        // 开始自动刷新
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            
            console.log('启动自动刷新（每2分钟）...');
            refreshInterval = setInterval(() => {
                if (isTradingTime() && !isLoading) {
                    refreshAll();
                }
            }, 120000);
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (refreshInterval) {
                console.log('停止自动刷新');
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // 判断是否在交易时间
        function isTradingTime() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            const minute = now.getMinutes();
            
            if (day === 0 || day === 6) return false;
            
            const time = hour * 100 + minute;
            return (time >= 930 && time <= 1130) || (time >= 1300 && time <= 1500);
        }

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN');
            document.getElementById('tradingDate').textContent = now.toLocaleDateString('zh-CN');
        }

        // 显示/隐藏加载指示器
        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
