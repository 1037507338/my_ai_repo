<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基金实时估值</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: #4a6cf7;
            color: white;
            padding: 16px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            opacity: 0.85;
            font-size: 12px;
        }

        .error-banner {
            padding: 10px 15px;
            background: #fee;
            color: #c33;
            border-bottom: 1px solid #fcc;
            display: none;
            font-size: 13px;
        }

        .error-banner.show {
            display: block;
        }

        .error-banner .close-btn {
            float: right;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .controls {
            padding: 12px 15px;
            background: #fafbfc;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 250px;
        }

        .input-group input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4a6cf7;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add {
            background: #4a6cf7;
            color: white;
        }

        .btn-add:hover {
            background: #3a5ce7;
        }

        .btn-save-order {
            background: #28a745;
            color: white;
        }

        .btn-save-order:hover {
            background: #218838;
        }

        .btn-refresh {
            background: #6c757d;
            color: white;
        }

        .btn-refresh:hover {
            background: #5a6268;
        }

        .btn-clear {
            background: #dc3545;
            color: white;
        }

        .btn-clear:hover {
            background: #c82333;
        }

        .status-bar {
            padding: 10px 15px;
            background: #f8f9fa;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-bar .time {
            font-weight: 600;
            color: #4a6cf7;
        }

        .cache-indicator {
            display: inline-block;
            padding: 2px 8px;
            background: #e8f0fe;
            color: #4a6cf7;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }

        /* 桌面端：表格布局 */
        .table-container {
            overflow-x: auto;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #495057;
            color: white;
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        tbody tr {
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr.updating {
            animation: flash 0.4s;
        }

        @keyframes flash {
            0%, 100% { background: white; }
            50% { background: #e8f0fe; }
        }

        td {
            padding: 10px 12px;
            font-size: 13px;
        }

        .fund-code {
            font-weight: 600;
            color: #4a6cf7;
        }

        .fund-name {
            color: #333;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .growth {
            font-weight: 700;
            font-size: 14px;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.3px;
        }

        .growth.positive {
            color: #dc3545;
        }

        .growth.negative {
            color: #28a745;
        }

        .delete-btn {
            padding: 5px 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .drag-handle {
            cursor: grab;
            color: #999;
            font-size: 16px;
            user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        tbody tr.dragging {
            opacity: 0.5;
        }

        tbody tr.drag-over {
            border-top: 2px solid #4a6cf7;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a6cf7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc3545;
            font-size: 12px;
        }

        /* 移动端 */
        @media (max-width: 768px) {
            body {
                padding: 0;
                background: white;
            }

            .container {
                border-radius: 0;
                box-shadow: none;
            }

            .header {
                padding: 10px 12px;
            }

            .header h1 {
                font-size: 16px;
            }

            .controls {
                display: none;
            }

            .status-bar {
                padding: 6px 10px;
                font-size: 10px;
            }

            .table-container {
                display: none;
            }

            .cards-container {
                display: block;
                padding: 4px;
            }

            .fund-card {
                background: #f8f9fa;
                border-radius: 6px;
                padding: 8px 10px;
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .card-left {
                flex: 1;
            }

            .card-fund-name {
                font-weight: 700;
                font-size: 14px;
                color: #333;
            }

            .card-fund-code {
                font-size: 11px;
                color: #4a6cf7;
                margin-top: 2px;
            }

            .card-right {
                text-align: right;
                margin-left: 10px;
            }

            .card-growth {
                font-size: 18px;
                font-weight: 600;
                font-family: "SF Mono", "Menlo", "Consolas", monospace;
                font-variant-numeric: tabular-nums;
                letter-spacing: -0.3px;
            }

            .card-growth.positive {
                color: #dc3545;
            }

            .card-growth.negative {
                color: #28a745;
            }

            .card-time {
                font-size: 10px;
                color: #999;
                margin-top: 2px;
                font-family: "SF Mono", "Menlo", monospace;
            }
        }

        @media (min-width: 769px) {
            .cards-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 基金实时估值</h1>
            <p>数据来源：天天基金网</p>
        </div>

        <div class="error-banner" id="errorBanner">
            <span class="close-btn" onclick="closeError()">×</span>
            <span id="errorMessage"></span>
        </div>

        <div class="controls">
            <div class="input-group">
                <input 
                    type="text" 
                    id="fundCodeInput" 
                    placeholder="输入基金代码（如：003567）"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    onkeypress="if(event.key==='Enter') addFund()"
                >
                <button class="btn-add" onclick="addFund()">添加</button>
            </div>
            <button class="btn-save-order" onclick="saveOrder()">保存顺序</button>
            <button class="btn-refresh" onclick="manualRefresh()">强制刷新</button>
            <button class="btn-clear" onclick="clearAll()">清空</button>
        </div>

        <div class="status-bar">
            <div>
                <span>📅 交易日：</span>
                <span class="time" id="tradingDate">--</span>
                <span style="margin-left: 8px;">⏰</span>
                <span class="time" id="currentTime">--:--:--</span>
            </div>
            <div>
                <span>更新：</span>
                <span id="lastUpdateTime" class="time">--</span>
                <span id="cacheIndicator" class="cache-indicator" style="display: none;">缓存</span>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>基金代码</th>
                        <th>基金名称</th>
                        <th>昨日净值</th>
                        <th>估算净值</th>
                        <th>估算涨幅</th>
                        <th>估值时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="fundTableBody">
                    <tr class="empty-state-row">
                        <td colspan="8">
                            <div class="empty-state">
                                <p>暂无基金，添加后跟踪</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="cards-container" id="fundCardsContainer">
            <div class="empty-state">
                <p>暂无基金</p>
            </div>
        </div>

        <div class="loading" id="loadingIndicator" style="display: none;">
            <div class="spinner"></div>
            <p style="margin-top: 8px;">加载中...</p>
        </div>
    </div>

    <script>
        let fundList = [];           // 基金代码列表
        let fundDataCache = {};      // 基金数据缓存
        let refreshInterval = null;
        let isLoading = false;

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorBanner').classList.add('show');
        }

        function closeError() {
            document.getElementById('errorBanner').classList.remove('show');
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成');
            loadFundList();
            updateTime();
            setInterval(updateTime, 1000);
        });

        // 从服务器加载基金列表（优先从缓存）
        async function loadFundList() {
            try {
                console.log('从服务器加载基金数据（缓存优先）...');
                
                const response = await fetch('/api/funds');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                const fundDataList = result.data || [];
                console.log('加载到基金数据：', fundDataList);
                
                // 更新缓存
                fundList = fundDataList.map(f => f.code);
                fundDataCache = {};
                fundDataList.forEach(f => {
                    fundDataCache[f.code] = f;
                });
                
                renderTable();
                renderCards();
                
                if (fundList.length > 0) {
                    startAutoRefresh();
                }
                
            } catch (error) {
                console.error('加载失败：', error);
                showError('加载失败：' + error.message);
            }
        }

        // 保存基金代码列表（含顺序）
        async function saveFundList() {
            try {
                const response = await fetch('/api/funds', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fundList)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                console.log('保存成功');
            } catch (error) {
                console.error('保存失败：', error);
                showError('保存失败：' + error.message);
                throw error;
            }
        }

        // 保存当前顺序到数据库
        async function saveOrder() {
            try {
                await saveFundList();
                alert('顺序已保存！');
            } catch (error) {
                alert('保存失败：' + error.message);
            }
        }

        // 获取单只基金数据
        async function fetchFundData(fundCode) {
            try {
                const response = await fetch(`/api/funds?code=${fundCode}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                return result.data;
            } catch (error) {
                console.error('获取基金数据失败：', fundCode, error);
                throw error;
            }
        }

        // 手动刷新（强制从API获取）
        async function manualRefresh() {
            console.log('强制刷新（并行查API）');
            showLoading(true);
            isLoading = true;
            
            try {
                const response = await fetch('/api/funds?force=true');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                const fundDataList = result.data || [];
                
                // 更新缓存
                fundList = fundDataList.map(f => f.code);
                fundDataCache = {};
                fundDataList.forEach(f => {
                    fundDataCache[f.code] = f;
                });
                
                renderTable();
                renderCards();
                
                document.getElementById('lastUpdateTime').textContent = new Date().toLocaleTimeString('zh-CN');
                document.getElementById('cacheIndicator').style.display = 'none';
                
            } catch (error) {
                showError('刷新失败：' + error.message);
            } finally {
                showLoading(false);
                isLoading = false;
            }
        }

        // 添加基金
        async function addFund() {
            if (isLoading) return;

            const input = document.getElementById('fundCodeInput');
            const code = input.value.trim();
            
            if (!code) {
                alert('请输入基金代码！');
                return;
            }

            if (fundList.includes(code)) {
                alert('该基金已在列表中！');
                return;
            }

            console.log('添加基金：', code);
            showLoading(true);
            isLoading = true;
            
            try {
                const data = await fetchFundData(code);
                if (data) {
                    fundList.push(code);
                    fundDataCache[code] = data;
                    await saveFundList();
                    renderTable();
                    renderCards();
                    input.value = '';
                    startAutoRefresh();
                } else {
                    alert('基金代码无效！');
                }
            } catch (error) {
                alert('添加失败：' + error.message);
            } finally {
                showLoading(false);
                isLoading = false;
            }
        }

        // 删除基金
        async function deleteFund(index) {
            if (!confirm('确定删除？')) return;
            
            const code = fundList[index];
            fundList.splice(index, 1);
            delete fundDataCache[code];
            
            try {
                await saveFundList();
                renderTable();
                renderCards();
                if (fundList.length === 0) stopAutoRefresh();
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        // 清空列表
        async function clearAll() {
            if (fundList.length === 0) return;
            if (!confirm('确定清空所有基金？')) return;
            
            fundList = [];
            fundDataCache = {};
            try {
                await saveFundList();
                renderTable();
                renderCards();
                stopAutoRefresh();
            } catch (error) {
                alert('清空失败：' + error.message);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('fundTableBody');
            
            if (fundList.length === 0) {
                tbody.innerHTML = '<tr class="empty-state-row"><td colspan="9"><div class="empty-state"><p>暂无基金，添加后跟踪</p></div></td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            
            fundList.forEach((code, index) => {
                const data = fundDataCache[code];
                const row = document.createElement('tr');
                row.draggable = true;
                row.dataset.index = index;
                
                row.innerHTML = `
                    <td><span class="drag-handle">☰</span></td>
                    <td>${index + 1}</td>
                    <td class="fund-code">${code}</td>
                    <td class="fund-name">${data ? data.name : '加载中...'}</td>
                    <td>${data ? data.nav.toFixed(4) : '--'}</td>
                    <td>${data && data.estimatedNav !== null ? data.estimatedNav.toFixed(4) : '--'}</td>
                    <td class="growth ${data && data.growth >= 0 ? 'positive' : data && data.growth < 0 ? 'negative' : ''}">${data ? (data.growth >= 0 ? '+' : '') + data.growth.toFixed(2) + '%' : '--'}</td>
                    <td>${data ? data.time : '--'}</td>
                    <td><button class="delete-btn" onclick="deleteFund(${index})">删除</button></td>
                `;
                tbody.appendChild(row);
            });
            
            initDragAndDrop();
        }

        function renderCards() {
            const container = document.getElementById('fundCardsContainer');
            
            if (fundList.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无基金</p></div>';
                return;
            }
            
            container.innerHTML = '';
            
            fundList.forEach((code, index) => {
                const data = fundDataCache[code];
                const card = document.createElement('div');
                card.className = 'fund-card';
                
                card.innerHTML = `
                    <div class="card-left">
                        <div class="card-fund-name">${data ? data.name : '加载中...'}</div>
                        <div class="card-fund-code">${code}</div>
                    </div>
                    <div class="card-right">
                        <div class="card-growth ${data && data.growth >= 0 ? 'positive' : data && data.growth < 0 ? 'negative' : ''}">${data ? (data.growth >= 0 ? '+' : '') + data.growth.toFixed(2) + '%' : '--'}</div>
                        <div class="card-time">${data ? data.time : '--'}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function initDragAndDrop() {
            const tbody = document.getElementById('fundTableBody');
            
            tbody.addEventListener('dragstart', function(e) {
                if (e.target.classList.contains('drag-handle')) {
                    dragSrcIndex = parseInt(e.target.closest('tr').dataset.index);
                    e.target.closest('tr').classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                }
            });

            tbody.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                
                const tr = e.target.closest('tr');
                if (tr && !tr.classList.contains('empty-state-row')) {
                    tr.classList.add('drag-over');
                }
            });

            tbody.addEventListener('dragleave', function(e) {
                const tr = e.target.closest('tr');
                if (tr) {
                    tr.classList.remove('drag-over');
                }
            });

            tbody.addEventListener('drop', function(e) {
                e.preventDefault();
                
                const tr = e.target.closest('tr');
                if (tr) {
                    tr.classList.remove('drag-over');
                }
                
                // 修复：移除错误的条件判断
                if (tr && !tr.classList.contains('empty-state-row')) {
                    const dropIndex = parseInt(tr.dataset.index);
                    
                    // 交换位置
                    const temp = fundList[dragSrcIndex];
                    fundList.splice(dragSrcIndex, 1);
                    fundList.splice(dropIndex, 0, temp);
                    
                    renderTable();
                }
            });

            tbody.addEventListener('dragend', function(e) {
                const rows = tbody.querySelectorAll('tr');
                rows.forEach(row => {
                    row.classList.remove('dragging', 'drag-over');
                });
            });
        }

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            
            console.log('启动定时任务（每30秒）');
            refreshInterval = setInterval(() => {
                if (isTradingTime() && !isLoading) {
                    loadFundList();  // 从缓存/API更新
                }
            }, 30000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function isTradingTime() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            const minute = now.getMinutes();
            
            if (day === 0 || day === 6) return false;
            
            const time = hour * 100 + minute;
            return (time >= 930 && time <= 1130) || (time >= 1300 && time <= 1500);
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN');
            document.getElementById('tradingDate').textContent = now.toLocaleDateString('zh-CN');
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
