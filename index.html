<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基金实时估值</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: #4a6cf7;
            color: white;
            padding: 16px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            opacity: 0.85;
            font-size: 12px;
        }

        .error-banner {
            padding: 10px 15px;
            background: #fee;
            color: #c33;
            border-bottom: 1px solid #fcc;
            display: none;
            font-size: 13px;
        }

        .error-banner.show {
            display: block;
        }

        .error-banner .close-btn {
            float: right;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .controls {
            padding: 12px 15px;
            background: #fafbfc;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 250px;
        }

        .input-group input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4a6cf7;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add {
            background: #4a6cf7;
            color: white;
        }

        .btn-add:hover {
            background: #3a5ce7;
        }

        .btn-refresh {
            background: #6c757d;
            color: white;
        }

        .btn-refresh:hover {
            background: #5a6268;
        }

        .btn-clear {
            background: #dc3545;
            color: white;
        }

        .btn-clear:hover {
            background: #c82333;
        }

        .status-bar {
            padding: 10px 15px;
            background: #f8f9fa;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-bar .time {
            font-weight: 600;
            color: #4a6cf7;
        }

        /* 桌面端：表格布局 */
        .table-container {
            overflow-x: auto;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #495057;
            color: white;
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr.updating {
            animation: flash 0.4s;
        }

        @keyframes flash {
            0%, 100% { background: white; }
            50% { background: #e8f0fe; }
        }

        td {
            padding: 10px 12px;
            font-size: 13px;
        }

        .fund-code {
            font-weight: 600;
            color: #4a6cf7;
        }

        .fund-name {
            color: #333;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav {
            font-family: "Courier New", monospace;
            font-weight: 600;
        }

        .growth {
            font-weight: 700;
            font-size: 14px;
            font-family: "Courier New", monospace;
        }

        .growth.positive {
            color: #dc3545;
        }

        .growth.negative {
            color: #28a745;
        }

        .delete-btn {
            padding: 5px 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a6cf7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc3545;
            font-size: 12px;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                padding: 0;
                background: white;
            }

            .container {
                border-radius: 0;
                box-shadow: none;
            }

            .header {
                padding: 12px 15px;
            }

            .header h1 {
                font-size: 17px;
            }

            /* 移动端隐藏添加栏 */
            .controls {
                display: none;
            }

            .status-bar {
                padding: 8px 12px;
                font-size: 11px;
            }

            /* 移动端：卡片布局 */
            .table-container {
                display: none;
            }

            .cards-container {
                display: block;
                padding: 8px;
            }

            .fund-card {
                background: #f8f9fa;
                border-radius: 8px;
                padding: 12px;
                margin-bottom: 8px;
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }

            .card-fund-code {
                font-weight: 700;
                font-size: 15px;
                color: #4a6cf7;
            }

            .card-fund-name {
                font-size: 13px;
                color: #666;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .card-growth {
                font-size: 28px;
                font-weight: 800;
                font-family: "Courier New", monospace;
                text-align: center;
                margin: 10px 0;
            }

            .card-growth.positive {
                color: #dc3545;
            }

            .card-growth.negative {
                color: #28a745;
            }

            .card-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 11px;
                color: #999;
                margin-top: 8px;
            }

            .card-delete-btn {
                width: 100%;
                padding: 8px;
                background: #dc3545;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                margin-top: 8px;
            }
        }

        /* 桌面端：隐藏卡片 */
        @media (min-width: 769px) {
            .cards-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 基金实时估值</h1>
            <p>数据来源：天天基金网</p>
        </div>

        <div class="error-banner" id="errorBanner">
            <span class="close-btn" onclick="closeError()">×</span>
            <span id="errorMessage"></span>
        </div>

        <!-- 桌面端：显示添加栏 -->
        <div class="controls">
            <div class="input-group">
                <input 
                    type="text" 
                    id="fundCodeInput" 
                    placeholder="输入基金代码（如：003567）"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    onkeypress="if(event.key==='Enter') addFund()"
                >
                <button class="btn-add" onclick="addFund()">添加</button>
            </div>
            <button class="btn-refresh" onclick="refreshAll()">刷新</button>
            <button class="btn-clear" onclick="clearAll()">清空</button>
        </div>

        <div class="status-bar">
            <div>
                <span>📅 交易日：</span>
                <span class="time" id="tradingDate">--</span>
                <span style="margin-left: 8px;">⏰</span>
                <span class="time" id="currentTime">--:--:--</span>
            </div>
            <div>
                最后更新：<span id="lastUpdateTime" class="time">--</span>
                <span style="margin-left: 8px; color: #999;">|</span>
                <span style="margin-left: 8px; font-size: 11px; color: #999;">1分钟自动刷新</span>
            </div>
        </div>

        <!-- 桌面端：表格布局 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>基金代码</th>
                        <th>基金名称</th>
                        <th>昨日净值</th>
                        <th>估算净值</th>
                        <th>估算涨幅</th>
                        <th>估值时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="fundTableBody">
                    <tr class="empty-state-row">
                        <td colspan="8">
                            <div class="empty-state">
                                <p>暂无基金，添加后跟踪</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 移动端：卡片布局 -->
        <div class="cards-container" id="fundCardsContainer">
            <div class="empty-state">
                <p>暂无基金</p>
            </div>
        </div>

        <div class="loading" id="loadingIndicator" style="display: none;">
            <div class="spinner"></div>
            <p style="margin-top: 8px;">加载中...</p>
        </div>
    </div>

    <script>
        let fundList = [];
        let refreshInterval = null;
        let isLoading = false;

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorBanner').classList.add('show');
        }

        function closeError() {
            document.getElementById('errorBanner').classList.remove('show');
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成');
            loadFundList();
            updateTime();
            setInterval(updateTime, 1000);
        });

        async function loadFundList() {
            try {
                const response = await fetch('/api/funds');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                fundList = result.data || [];
                console.log('基金列表：', fundList);
                
                renderTable();
                renderCards();
                
                if (fundList.length > 0) {
                    refreshAll();
                    startAutoRefresh();
                }
            } catch (error) {
                console.error('加载失败：', error);
                showError('加载失败：' + error.message);
            }
        }

        async function saveFundList() {
            try {
                const response = await fetch('/api/funds', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fundList)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                console.log('保存成功');
            } catch (error) {
                console.error('保存失败：', error);
                showError('保存失败：' + error.message);
                throw error;
            }
        }

        async function addFund() {
            if (isLoading) return;

            const input = document.getElementById('fundCodeInput');
            const code = input.value.trim();
            
            if (!code) {
                alert('请输入基金代码！');
                return;
            }

            if (fundList.includes(code)) {
                alert('该基金已在列表中！');
                return;
            }

            console.log('添加基金：', code);
            showLoading(true);
            isLoading = true;
            
            try {
                const data = await fetchFundData(code);
                if (data) {
                    fundList.push(code);
                    await saveFundList();
                    renderTable();
                    renderCards();
                    input.value = '';
                    refreshAll();
                    startAutoRefresh();
                } else {
                    alert('基金代码无效！');
                }
            } catch (error) {
                alert('添加失败：' + error.message);
            } finally {
                showLoading(false);
                isLoading = false;
            }
        }

        async function deleteFund(index) {
            if (!confirm('确定删除？')) return;
            
            fundList.splice(index, 1);
            try {
                await saveFundList();
                renderTable();
                renderCards();
                if (fundList.length === 0) stopAutoRefresh();
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        async function clearAll() {
            if (fundList.length === 0) return;
            if (!confirm('确定清空所有基金？')) return;
            
            fundList = [];
            try {
                await saveFundList();
                renderTable();
                renderCards();
                stopAutoRefresh();
            } catch (error) {
                alert('清空失败：' + error.message);
            }
        }

        async function fetchFundData(fundCode) {
            try {
                const response = await fetch(`/api/fund?code=${fundCode}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.error);
                
                const data = result.data;
                
                return {
                    code: data.fundcode,
                    name: data.name,
                    nav: parseFloat(data.dwjz),
                    estimatedNav: data.gsz ? parseFloat(data.gsz) : null,
                    growth: data.gszzl ? parseFloat(data.gszzl) : 0,
                    time: data.gztime
                };
            } catch (error) {
                console.error('获取基金数据失败：', error);
                throw error;
            }
        }

        async function refreshAll() {
            if (fundList.length === 0 || isLoading) return;
            
            console.log('刷新基金...');
            showLoading(true);
            isLoading = true;
            
            for (let i = 0; i < fundList.length; i++) {
                try {
                    const data = await fetchFundData(fundList[i]);
                    if (data) {
                        updateRow(i, data);
                        updateCard(i, data);
                    }
                } catch (error) {
                    updateRowError(i);
                    updateCardError(i);
                }
            }
            
            document.getElementById('lastUpdateTime').textContent = new Date().toLocaleTimeString('zh-CN');
            showLoading(false);
            isLoading = false;
        }

        function updateRow(index, data) {
            const rows = document.querySelectorAll('#fundTableBody tr:not(.empty-state-row)');
            if (index >= rows.length) return;
            
            const row = rows[index];
            row.classList.add('updating');
            
            row.cells[2].textContent = data.name;
            row.cells[3].textContent = data.nav.toFixed(4);
            
            if (data.estimatedNav !== null) {
                row.cells[4].textContent = data.estimatedNav.toFixed(4);
                row.cells[5].textContent = data.growth.toFixed(2) + '%';
                row.cells[5].className = 'growth ' + (data.growth >= 0 ? 'positive' : 'negative');
                row.cells[6].textContent = data.time;
            } else {
                row.cells[4].textContent = '暂无';
                row.cells[5].textContent = '--';
                row.cells[5].className = 'growth';
                row.cells[6].textContent = '非交易时间';
            }
            
            setTimeout(() => row.classList.remove('updating'), 400);
        }

        function updateCard(index, data) {
            const cards = document.querySelectorAll('.fund-card');
            if (index >= cards.length) return;
            
            const card = cards[index];
            card.querySelector('.card-fund-name').textContent = data.name;
            
            if (data.estimatedNav !== null) {
                card.querySelector('.card-growth').textContent = (data.growth >= 0 ? '+' : '') + data.growth.toFixed(2) + '%';
                card.querySelector('.card-growth').className = 'card-growth ' + (data.growth >= 0 ? 'positive' : 'negative');
                card.querySelector('.card-footer').innerHTML = `<span>${data.time}</span><span>估值时间</span>`;
            } else {
                card.querySelector('.card-growth').textContent = '--';
                card.querySelector('.card-growth').className = 'card-growth';
                card.querySelector('.card-footer').innerHTML = `<span>非交易时间</span>`;
            }
        }

        function updateRowError(index) {
            const rows = document.querySelectorAll('#fundTableBody tr:not(.empty-state-row)');
            if (index >= rows.length) return;
            
            const row = rows[index];
            row.cells[2].textContent = '获取失败';
            row.cells[2].className = 'error';
        }

        function updateCardError(index) {
            const cards = document.querySelectorAll('.fund-card');
            if (index >= cards.length) return;
            
            const card = cards[index];
            card.querySelector('.card-fund-name').textContent = '获取失败';
            card.querySelector('.card-fund-name').className = 'card-fund-name error';
        }

        function renderTable() {
            const tbody = document.getElementById('fundTableBody');
            
            if (fundList.length === 0) {
                tbody.innerHTML = '<tr class="empty-state-row"><td colspan="8"><div class="empty-state"><p>暂无基金，添加后跟踪</p></div></td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            
            fundList.forEach((code, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="fund-code">${code}</td>
                    <td class="fund-name">加载中...</td>
                    <td class="nav">--</td>
                    <td class="nav">--</td>
                    <td class="growth">--</td>
                    <td>--</td>
                    <td><button class="delete-btn" onclick="deleteFund(${index})">删除</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderCards() {
            const container = document.getElementById('fundCardsContainer');
            
            if (fundList.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无基金</p></div>';
                return;
            }
            
            container.innerHTML = '';
            
            fundList.forEach((code, index) => {
                const card = document.createElement('div');
                card.className = 'fund-card';
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-fund-code">${code}</span>
                        <span class="card-fund-name">加载中...</span>
                    </div>
                    <div class="card-growth">--</div>
                    <div class="card-footer">
                        <span>--</span>
                        <span>估值时间</span>
                    </div>
                    <button class="card-delete-btn" onclick="deleteFund(${index})">删除</button>
                `;
                
                container.appendChild(card);
            });
        }

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            
            console.log('启动自动刷新（1分钟）');
            refreshInterval = setInterval(() => {
                if (isTradingTime() && !isLoading) {
                    refreshAll();
                }
            }, 60000); // 60000ms = 1分钟
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function isTradingTime() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            const minute = now.getMinutes();
            
            if (day === 0 || day === 6) return false;
            
            const time = hour * 100 + minute;
            return (time >= 930 && time <= 1130) || (time >= 1300 && time <= 1500);
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN');
            document.getElementById('tradingDate').textContent = now.toLocaleDateString('zh-CN');
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
